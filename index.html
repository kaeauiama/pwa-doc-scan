<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>pwa-doc-scan</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="./icon.svg">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#111; --mut:#666; --line:#ddd; --card:#f7f7f8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121214; --fg:#eee; --mut:#999; --line:#333; --card:#1c1c20; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; max-width:640px; font:15px/1.7 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--fg); }
  h1 { font-size:20px; margin:0 0 4px; }
  p.lead { color:var(--mut); font-size:13px; margin:0 0 20px; }
  .card { background:var(--card); border-radius:10px; padding:14px 16px; margin:12px 0; }
  a.btn { display:inline-block; padding:10px 16px; border-radius:8px; background:var(--fg); color:var(--bg); text-decoration:none; font-weight:600; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
  th { color:var(--mut); font-weight:600; width:55%; }
  code { font-size:12px; }
</style>
</head>
<body>
<h1>pwa-doc-scan</h1>
<p class="lead">書類スキャン特化の PWA。撮影・処理・保存をすべて端末内で完結させます。</p>

<div class="card">
  <b>現在 M1(実装中)です。撮影 UI はまだありません。</b><br>
  計測ページで <b>6. 解像度の切り替え</b> / <b>7. 実フレームレート</b> / <b>8. ライト</b> を
  実機で測ってください。撮影方式(プレビュー解像度をどうするか)がその数値で決まります。
</div>

<p><a class="btn" href="probe/">実機能力計測ページを開く</a></p>

<div class="card">
  <b>この端末の状態</b>
  <table id="t"></table>
</div>

<p class="lead">
このページは画像を一切送信しません。処理はすべてブラウザ内で行われます。
</p>

<script type="module">
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const rows = {
    "HTTPS(secure context)": isSecureContext,
    "カメラ API (getUserMedia)": !!navigator.mediaDevices?.getUserMedia,
    "ファイル共有 (share files)": (() => {
      try {
        return navigator.canShare?.({ files: [new File([new Uint8Array([1])], "a.pdf", { type: "application/pdf" })] }) ?? false;
      } catch { return false; }
    })(),
    "PDF 生成 (CompressionStream)": (() => {
      try { new CompressionStream("deflate"); return true; } catch { return false; } })(),
    "ホーム画面から起動している": standalone,
    "manifest の display-mode が効いている": matchMedia("(display-mode: standalone)").matches,
  };
  const t = document.getElementById("t");
  for (const [k, v] of Object.entries(rows)) {
    const tr = document.createElement("tr");
    const th = document.createElement("th"); th.textContent = k;
    const td = document.createElement("td");
    td.textContent = v ? "OK" : "利用不可";
    td.style.color = v ? "#0a7" : "#c33";
    tr.append(th, td); t.append(tr);
  }
</script>
</body>
</html>
